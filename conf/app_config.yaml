logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

db_meta:
  host: localhost
  port: 3306
  user: didilili
  password: dili123
  database: meta

db_dw:
  host: localhost
  port: 3306
  user: didilili
  password: dili123
  database: dw

qdrant:
  host: localhost
  port: 6333
  embedding_size: 1024

embedding:
  host: localhost
  port: 8081
  model: BAAI/bge-large-zh-v1.5

es:
  host: localhost
  port: 9200
  index_name: data_agent

llm:
  model_name: ${oc.env:LLM_MODEL}
  api_key: ${oc.env:LLM_API_KEY}
  base_url: ${oc.env:LLM_BASE_URL}

# 召回阶段的初始超时预算，单位为秒。实际部署应按真实依赖的延迟重新测量。
recall:
  total_seconds: 8.0
  column_seconds: 6.0
  metric_seconds: 6.0
  value_seconds: 6.0
  expansion_seconds: 2.0

# SQL execution limits are deployment-owned and cannot be raised by the model.
sql_execution:
  max_rows: 1000
  row_filters: {}
  # Set only after verifying column types in the deployment; see docs/sql-row-scope.md.
  row_scope_column_types: {}
