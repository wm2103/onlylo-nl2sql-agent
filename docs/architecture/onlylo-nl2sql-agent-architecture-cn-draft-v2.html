<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>onlylo-nl2sql-agent · 中文架构图草稿 v2</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #64748b;
      --line: #dbe3ef;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --purple: #7c3aed;
      --purple-soft: #f5f3ff;
      --green: #059669;
      --green-soft: #ecfdf5;
      --amber: #d97706;
      --amber-soft: #fffbeb;
      --red: #dc2626;
      --red-soft: #fef2f2;
      --panel: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 30px;
      color: var(--ink);
      background: #f4f7fb;
      font: 14px/1.55 "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    }
    .page { max-width: 1450px; margin: 0 auto; }
    .eyebrow { color: var(--blue); font-size: 12px; font-weight: 700; letter-spacing: .12em; }
    h1 { margin: 6px 0 4px; font-size: 28px; letter-spacing: -.03em; }
    .subtitle { margin: 0 0 24px; color: var(--muted); }
    .diagram-shell {
      padding: 18px;
      overflow-x: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 14px 38px rgba(30, 64, 175, .08);
    }
    svg { display: block; min-width: 1260px; width: 100%; height: auto; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 16px; }
    .card { padding: 16px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
    .card h2 { margin: 0 0 8px; font-size: 15px; }
    .card p { margin: 0; color: var(--muted); font-size: 13px; }
    .card strong { color: var(--ink); }
    .note { margin-top: 14px; color: #94a3b8; font-size: 12px; }
    @media (max-width: 760px) {
      body { padding: 18px; }
      h1 { font-size: 23px; }
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="eyebrow">ONLYLO · NL2SQL AGENT</div>
    <h1>自然语言问数系统架构图</h1>
    <p class="subtitle">以“用户提问 → 检索证据 → 生成 SQL → 安全执行 → 返回结果”为主线的中文草稿</p>

    <section class="diagram-shell">
      <svg viewBox="0 0 1400 820" role="img" aria-label="onlylo-nl2sql-agent 中文业务流程架构图">
        <defs>
          <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb" />
          </marker>
          <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8" />
          </marker>
          <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626" />
          </marker>
          <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
            <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#64748b" flood-opacity=".12" />
          </filter>
        </defs>

        <rect x="0" y="0" width="1400" height="820" rx="14" fill="#fbfdff" />

        <!-- lanes -->
        <rect x="28" y="28" width="1344" height="112" rx="14" fill="#f8fafc" stroke="#e2e8f0" />
        <text x="52" y="58" fill="#475569" font-size="13" font-weight="700">用户与入口</text>
        <text x="52" y="82" fill="#94a3b8" font-size="11">问题从前端进入 API，并以 SSE 流式返回结果</text>

        <rect x="28" y="166" width="1344" height="380" rx="14" fill="#f8fbff" stroke="#bfdbfe" />
        <text x="52" y="198" fill="#1d4ed8" font-size="13" font-weight="700">问数处理主流程</text>
        <text x="52" y="220" fill="#64748b" font-size="11">核心路径只保留业务决策节点；技术组件放在节点下方作为说明</text>

        <rect x="28" y="574" width="1344" height="218" rx="14" fill="#fcfcff" stroke="#ddd6fe" />
        <text x="52" y="606" fill="#6d28d9" font-size="13" font-weight="700">数据与模型支撑</text>
        <text x="52" y="628" fill="#64748b" font-size="11">为检索、证据判断、SQL 生成和执行提供外部能力</text>

        <!-- entry -->
        <g filter="url(#shadow)">
          <rect x="220" y="54" width="235" height="58" rx="11" fill="#ffffff" stroke="#2563eb" stroke-width="1.7" />
          <text x="337" y="79" text-anchor="middle" fill="#172033" font-size="15" font-weight="700">Web 前端</text>
          <text x="337" y="99" text-anchor="middle" fill="#64748b" font-size="11">React + Vite · 查询结果展示</text>
          <rect x="745" y="54" width="270" height="58" rx="11" fill="#ffffff" stroke="#2563eb" stroke-width="1.7" />
          <text x="880" y="79" text-anchor="middle" fill="#172033" font-size="15" font-weight="700">API 接入</text>
          <text x="880" y="99" text-anchor="middle" fill="#64748b" font-size="11">FastAPI · /api/query · SSE</text>
        </g>
        <path d="M455 83 H735" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />

        <!-- main flow nodes -->
        <g filter="url(#shadow)">
          <rect x="72" y="270" width="190" height="94" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.7" />
          <text x="167" y="304" text-anchor="middle" fill="#172033" font-size="15" font-weight="700">① 接收问题</text>
          <text x="167" y="328" text-anchor="middle" fill="#64748b" font-size="11">自然语言问题</text>
          <text x="167" y="346" text-anchor="middle" fill="#64748b" font-size="11">请求上下文</text>

          <rect x="295" y="270" width="190" height="94" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.7" />
          <text x="390" y="304" text-anchor="middle" fill="#172033" font-size="15" font-weight="700">② 抽取关键词</text>
          <text x="390" y="328" text-anchor="middle" fill="#64748b" font-size="11">实体 · 指标 · 时间</text>
          <text x="390" y="346" text-anchor="middle" fill="#64748b" font-size="11">筛选条件</text>

          <rect x="518" y="270" width="190" height="94" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.7" />
          <text x="613" y="304" text-anchor="middle" fill="#172033" font-size="15" font-weight="700">③ 混合检索</text>
          <text x="613" y="328" text-anchor="middle" fill="#64748b" font-size="11">字段 · 指标 · 字段值</text>
          <text x="613" y="346" text-anchor="middle" fill="#64748b" font-size="11">多路召回并行执行</text>

          <rect x="741" y="270" width="190" height="94" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.7" />
          <text x="836" y="304" text-anchor="middle" fill="#172033" font-size="15" font-weight="700">④ 判断证据</text>
          <text x="836" y="328" text-anchor="middle" fill="#64748b" font-size="11">合并召回结果</text>
          <text x="836" y="346" text-anchor="middle" fill="#64748b" font-size="11">判断是否足以继续</text>

          <rect x="964" y="270" width="190" height="94" rx="12" fill="#ffffff" stroke="#059669" stroke-width="1.7" />
          <text x="1059" y="304" text-anchor="middle" fill="#172033" font-size="15" font-weight="700">⑤ 生成 SQL</text>
          <text x="1059" y="328" text-anchor="middle" fill="#64748b" font-size="11">组织上下文</text>
          <text x="1059" y="346" text-anchor="middle" fill="#64748b" font-size="11">LLM 生成候选 SQL</text>

          <rect x="1187" y="270" width="160" height="94" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="1.7" />
          <text x="1267" y="304" text-anchor="middle" fill="#172033" font-size="15" font-weight="700">⑥ SQL 治理</text>
          <text x="1267" y="328" text-anchor="middle" fill="#64748b" font-size="11">只读 · 白名单</text>
          <text x="1267" y="346" text-anchor="middle" fill="#64748b" font-size="11">范围 · 超时</text>
        </g>

        <!-- flow arrows -->
        <path d="M262 317 H285" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />
        <path d="M485 317 H508" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />
        <path d="M708 317 H731" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />
        <path d="M931 317 H954" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />
        <path d="M1154 317 H1177" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />

        <!-- evidence branches -->
        <path d="M836 364 V418 H750" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-blue)" />
        <path d="M836 364 V474 H915" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-red)" />
        <rect x="618" y="405" width="218" height="54" rx="10" fill="#ecfdf5" stroke="#86efac" />
        <text x="727" y="428" text-anchor="middle" fill="#166534" font-size="13" font-weight="700">证据充分</text>
        <text x="727" y="446" text-anchor="middle" fill="#4b7a5d" font-size="10">继续生成 SQL</text>
        <rect x="774" y="462" width="218" height="54" rx="10" fill="#fef2f2" stroke="#fca5a5" />
        <text x="883" y="485" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="700">证据不足</text>
        <text x="883" y="503" text-anchor="middle" fill="#a65c5c" font-size="10">阻断 · 返回 unknown</text>

        <!-- governance branches -->
        <path d="M1267 364 V420 H1110" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-blue)" />
        <path d="M1267 364 V478 H1240" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-red)" />
        <rect x="1018" y="405" width="205" height="54" rx="10" fill="#ecfdf5" stroke="#86efac" />
        <text x="1120" y="428" text-anchor="middle" fill="#166534" font-size="13" font-weight="700">通过</text>
        <text x="1120" y="446" text-anchor="middle" fill="#4b7a5d" font-size="10">进入数据库执行</text>
        <rect x="1137" y="462" width="205" height="54" rx="10" fill="#fef2f2" stroke="#fca5a5" />
        <text x="1239" y="485" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="700">不安全或可修正</text>
        <text x="1239" y="503" text-anchor="middle" fill="#a65c5c" font-size="10">拒绝 · 有界重试</text>

        <!-- support layer -->
        <g filter="url(#shadow)">
          <rect x="160" y="668" width="250" height="70" rx="11" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5" />
          <text x="285" y="697" text-anchor="middle" fill="#172033" font-size="14" font-weight="700">元数据与教学数仓</text>
          <text x="285" y="718" text-anchor="middle" fill="#64748b" font-size="11">MySQL · 表结构 · 示例数据</text>
          <rect x="510" y="668" width="250" height="70" rx="11" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5" />
          <text x="635" y="697" text-anchor="middle" fill="#172033" font-size="14" font-weight="700">向量与关键词索引</text>
          <text x="635" y="718" text-anchor="middle" fill="#64748b" font-size="11">Qdrant · Elasticsearch</text>
          <rect x="860" y="668" width="250" height="70" rx="11" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5" />
          <text x="985" y="697" text-anchor="middle" fill="#172033" font-size="14" font-weight="700">Embedding 与 LLM</text>
          <text x="985" y="718" text-anchor="middle" fill="#64748b" font-size="11">TEI · OpenAI-compatible API</text>
          <rect x="1210" y="668" width="130" height="70" rx="11" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
          <text x="1275" y="697" text-anchor="middle" fill="#172033" font-size="14" font-weight="700">结果返回</text>
          <text x="1275" y="718" text-anchor="middle" fill="#64748b" font-size="11">SSE 流式</text>
        </g>
        <path d="M285 668 V610 H613 V364" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-muted)" />
        <path d="M635 668 V590 H613 V364" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-muted)" />
        <path d="M985 668 V590 H1059 V364" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-muted)" />
        <path d="M1110 432 V620 H1275 V668" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-blue)" />

        <!-- legend -->
        <g transform="translate(56 764)">
          <circle cx="8" cy="8" r="6" fill="#2563eb" /><text x="22" y="12" fill="#64748b" font-size="11">主流程</text>
          <circle cx="92" cy="8" r="6" fill="#7c3aed" /><text x="106" y="12" fill="#64748b" font-size="11">检索支撑</text>
          <circle cx="190" cy="8" r="6" fill="#059669" /><text x="204" y="12" fill="#64748b" font-size="11">允许继续</text>
          <circle cx="288" cy="8" r="6" fill="#dc2626" /><text x="302" y="12" fill="#64748b" font-size="11">阻断或拒绝</text>
          <text x="1110" y="12" fill="#94a3b8" font-size="10">Draft v2 · 业务流程视角</text>
        </g>
      </svg>
    </section>

    <section class="cards">
      <article class="card">
        <h2>主流程</h2>
        <p><strong>问题 → 关键词 → 混合检索 → 证据判断 → SQL → 治理 → 结果</strong>。图中只保留影响业务结果的关键决策点。</p>
      </article>
      <article class="card">
        <h2>可靠性出口</h2>
        <p>证据不足进入 <strong>unknown / 阻断</strong>；SQL 不安全进入 <strong>拒绝</strong>；可修复错误进入 <strong>有界重试</strong>。</p>
      </article>
      <article class="card">
        <h2>发布状态</h2>
        <p>本图是中文备用草稿。当前 README 仍暂时使用原有中文架构图，待你验收后再决定是否替换。</p>
      </article>
    </section>
    <p class="note">离线单文件，无外部资源依赖；可直接用浏览器打开。</p>
  </main>
</body>
</html>
